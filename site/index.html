<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkhound Process Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Process Library">
    <a class="brand" href="#home">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="#81BE41" stroke-width="2.4"/><path d="M8 9h8M8 12h8M8 15h5" stroke="#81BE41" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Sparkhound<br>Process Library<small>APQC PCF v8.0 · 1/1/2027 model</small></span>
    </a>
    <a class="nav" data-v="home" href="#home">Home</a>
    <div class="navlab">Browse</div>
    <a class="nav" data-v="library" href="#library">Library</a>
    <a class="nav" data-v="taxonomy" href="#taxonomy">Taxonomy</a>
    <a class="nav" data-v="flows" href="#flows">Process flows <span class="count" id="flowCount"></span></a>
    <div class="navlab">Reference</div>
    <a class="nav" data-v="systems" href="#systems">Systems</a>
    <a class="nav" data-v="controls" href="#controls">Controls</a>

  </nav>
  <main>
    <header class="top">
      <div class="search" role="search">
        <label for="q">Search</label>
        <input id="q" type="search" placeholder="Search processes, owners, systems, controls…" autocomplete="off">
      </div>
      <span class="proto">Prototype · sell, do and bill work flows</span>
    </header>
    <div id="view" class="view" aria-live="polite"><p class="muted">Loading the process library…</p></div>
  </main>
</div>
<script src="app.js"></script>

</html>
