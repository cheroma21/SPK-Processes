<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkhound Process Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;900&family=Overpass+Mono:wght@500&family=Barlow+Condensed:wght@600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <nav class="side" aria-label="Process Library">
    <a class="brand" href="#home" aria-label="Sparkhound Process, home">
      <span class="lockup">
        <img src="assets/sparkhound-logo-white.png" alt="Sparkhound" width="584" height="131">
        <span class="subrow" aria-hidden="true"><span class="rule"></span><span class="subbrand"><span>P</span><span>R</span><span>O</span><span>C</span><span>E</span><span>S</span><span>S</span></span></span>
      </span>
    </a>
    <a class="nav" data-v="home" href="#home">Home</a>
    <div class="navlab">Browse</div>
    <a class="nav" data-v="library" href="#library">Library</a>
    <a class="nav" data-v="taxonomy" href="#taxonomy">Taxonomy</a>
    <a class="nav" data-v="flows" href="#flows">Process flows <span class="count" id="flowCount"></span></a>
    <div class="navlab">Reference</div>
    <a class="nav" data-v="systems" href="#systems">Systems</a>
    <a class="nav" data-v="dataflow" href="#dataflow">Data flows</a>
    <a class="nav" data-v="controls" href="#controls">Controls</a>
    <a class="nav" data-v="review" href="#review">Review <span class="count" id="flagCount"></span></a>
    <a class="nav" data-v="glossary" href="#glossary">Glossary</a>
  </nav>
  <main>
    <header class="top">
      <div class="search" role="search">
        <label for="q">Search</label>
        <input id="q" type="search" placeholder="Search processes, owners, systems, controls…" autocomplete="off">
      </div>
      <span class="proto">Prototype<span class="sep" aria-hidden="true">·</span>Sales, Operations and Finance flows</span>
    </header>
    <div id="view" class="view" tabindex="-1" aria-live="polite"><p class="muted">Loading the process library…</p></div>
  </main>
</div>
<script src="app.js"></script>

</html>
